[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endurance-lab"
version = "0.1.0"
description = "Private, local-first endurance training analytics from TCX, FIT, and strength JSON files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "garmin-fit-sdk>=21.195,<22",
  "pandas>=2.0",
  "playwright>=1.49,<2",
  "plotly>=5.18",
  "PyYAML>=6.0",
  "requests>=2.31,<3",
  "streamlit>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
endurance-lab = "endurance_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
